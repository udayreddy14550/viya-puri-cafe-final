<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4a2c1a">
<title>Staff sign in · Viya Puri Café</title>
<link rel="icon" href="/assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<main class="login-wrap">
  <section class="login-card" aria-labelledby="t">
    <div class="brand"><img src="/assets/logo.webp" alt="" width="64" height="64"><div><b>Viya Puri Café</b><span>Staff area</span></div></div>
    <div><h1 id="t">Sign in</h1><p class="muted small" style="margin-top:6px">Use the email address and password set up for you by the café owner.</p></div>
    <form id="f" novalidate style="display:grid;gap:14px">
      <div id="msg" role="alert" aria-live="assertive" hidden></div>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required><span class="err" id="e-email" hidden></span></div>
      <div class="field"><label for="pw">Password</label>
        <div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" id="toggle" aria-pressed="false" aria-controls="pw">Show</button></div>
        <span class="err" id="e-pw" hidden></span></div>
      <button class="btn primary block" id="go" type="submit">Sign in</button>
    </form>
    <p class="small muted">Not staff? <a href="/">Back to the café website</a></p>
  </section>
</main>
<script src="/admin/assets/login.js"></script>
</body>
</html>
